<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boost Desk — Log in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/assets/app.css?v=17">
<style>
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center}
  .box{max-width:420px;width:100%;display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
  .err{background:var(--live-soft);color:var(--live);border-radius:8px;padding:10px 12px;font-size:.9rem}
</style>
</head>
<body>
<main class="login">
  <div class="box">
    <h1>Boost Desk</h1>
    <p class="muted" style="margin:0">Daily boost spend for every client, pulled straight from Ads Manager.</p>
    <div id="err" class="err" hidden></div>
    <a class="fbbtn" href="/auth/facebook">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
      Continue with Facebook
    </a>
    <p class="hint" style="margin:0">The app asks for read-only access to your ad accounts (ads_read). It never changes your ads.</p>
  </div>
</main>
<script>
  const e = new URLSearchParams(location.search).get('error');
  if (e) { const el = document.getElementById('err'); el.textContent = e; el.hidden = false; }
</script>
</body>
</html>
